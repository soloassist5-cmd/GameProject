<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030409" />
    <title>ЭХО</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600&family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="hud-part">
      <div id="hud-depth">ГЛУБИНА 1</div>
    </div>

    <div id="abilities" class="hud-part">
      <div id="ability-stones" class="ability">
        <div id="hud-stones" class="pebbles" aria-hidden="true"></div>
        <div class="ability-text">
          <span class="ability-name">Камни <span id="hud-stones-count" class="count"></span></span>
          <span class="ability-sub"><span class="keycap">ЛКМ</span><span id="hud-stones-note"></span></span>
        </div>
      </div>
      <div id="ability-clap" class="ability">
        <div id="hud-clap" aria-hidden="true"><span></span></div>
        <div class="ability-text">
          <span class="ability-name">Хлопок</span>
          <span class="ability-sub"><span class="keycap">Пробел</span></span>
        </div>
      </div>
    </div>
    <div id="hint"></div>
    <div id="fps"></div>

    <section id="screen-title" class="screen">
      <h1 class="logo">ЭХО</h1>
      <p class="tagline">Ты не видишь. Ты слышишь.<br />И оно — тоже.</p>
      <p class="cta">Кликни, чтобы начать</p>
      <p class="small">🎧 Лучше в наушниках<span id="title-best"></span></p>
    </section>

    <section id="screen-paused" class="screen">
      <h2>Пауза</h2>
      <p class="small">Esc — продолжить · R — заново · M — звук</p>
    </section>

    <section id="screen-dead" class="screen">
      <h2 class="red">Тебя услышали</h2>
      <p id="dead-stats" class="small"></p>
      <p class="cta">R или клик — ещё раз</p>
    </section>

    <section id="screen-won" class="screen">
      <h2 class="gold">Выход найден</h2>
      <p class="small">Спускаемся глубже…</p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
